name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
          fi
          source "$HOME/.cargo/env"
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Install
        run: npm ci

      - name: Ops drill (startup guards)
        run: |
          set -euo pipefail
          OUT="$(npm run -s ops:drill-guards)"
          printf '%s\n' "$OUT"
          grep -q 'trust-root-invalid-strict' <<<"$OUT"
          grep -q 'revocation-stale' <<<"$OUT"

      - name: Release preflight gate
        run: |
          set -euo pipefail

          SUMMARY_JSON="$RUNNER_TEMP/release-preflight-summary.json"
          GATE_IDS_FILE="$RUNNER_TEMP/release-preflight-gate-ids.txt"
          FAILED_GATE_ID_FILE="$RUNNER_TEMP/release-preflight-failed-gate-id.txt"
          HAS_GATES_FILE="$RUNNER_TEMP/release-preflight-has-gates.txt"
          PARSE_ERROR_FILE="$RUNNER_TEMP/release-preflight-parse-error.log"

          : >"$GATE_IDS_FILE"
          : >"$FAILED_GATE_ID_FILE"
          printf '0\n' >"$HAS_GATES_FILE"
          : >"$PARSE_ERROR_FILE"

          set +e
          npm run -s ops:release-preflight -- --json >"$SUMMARY_JSON"
          PREFLIGHT_EXIT=$?
          set -e

          SUMMARY_JSON_MISSING=0
          SUMMARY_JSON_INVALID=0

          if [[ ! -s "$SUMMARY_JSON" ]]; then
            SUMMARY_JSON_MISSING=1
          else
            set +e
            node -e "
              const fs = require('node:fs');
              const summary = JSON.parse(fs.readFileSync(process.argv[1], 'utf8'));
              const gates = Array.isArray(summary?.gates) ? summary.gates : [];
              const gateIds = gates
                .map((gate) => (typeof gate?.id === 'string' ? gate.id.trim() : ''))
                .filter(Boolean)
                .sort((left, right) => left.localeCompare(right));
              const failedGate = gates.find((gate) => gate?.ok === false);
              const failedGateId =
                typeof failedGate?.id === 'string' ? failedGate.id.trim() : '';
              fs.writeFileSync(process.argv[2], gateIds.length > 0 ? gateIds.join('\n') + '\n' : '');
              fs.writeFileSync(process.argv[3], failedGateId.length > 0 ? failedGateId + '\n' : '');
              fs.writeFileSync(process.argv[4], gates.length > 0 ? '1\n' : '0\n');
            " \
              "$SUMMARY_JSON" \
              "$GATE_IDS_FILE" \
              "$FAILED_GATE_ID_FILE" \
              "$HAS_GATES_FILE" \
              2>"$PARSE_ERROR_FILE"
            PARSE_EXIT=$?
            set -e
            if [[ "$PARSE_EXIT" -ne 0 ]]; then
              SUMMARY_JSON_INVALID=1
            fi
          fi

          HAS_GATES="$(tr -d '\n' <"$HAS_GATES_FILE")"
          FAILED_GATE_ID="$(tr -d '\n' <"$FAILED_GATE_ID_FILE")"

          echo 'Release preflight JSON summary:'
          if [[ -s "$SUMMARY_JSON" ]]; then
            cat "$SUMMARY_JSON"
          else
            echo '(missing summary output)'
          fi

          echo 'Release preflight gate IDs (sorted):'
          if [[ -s "$GATE_IDS_FILE" ]]; then
            cat "$GATE_IDS_FILE"
          else
            echo '(none)'
          fi

          {
            echo '### Release preflight JSON summary'
            echo '```json'
            if [[ -s "$SUMMARY_JSON" ]]; then
              cat "$SUMMARY_JSON"
            else
              echo '{}'
            fi
            echo '```'
            echo
            echo '### Release preflight gate IDs (sorted)'
            if [[ -s "$GATE_IDS_FILE" ]]; then
              while IFS= read -r gate_id; do
                printf -- '- `%s`\n' "$gate_id"
              done < "$GATE_IDS_FILE"
            else
              echo '- `(none)`'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$PREFLIGHT_EXIT" -ne 0 ]]; then
            TRIAGE_ANCHOR='ci-preflight-failure-triage-map'
            if [[ -n "$FAILED_GATE_ID" ]]; then
              TRIAGE_ANCHOR="ci-preflight-gate-${FAILED_GATE_ID}"
            fi
            TRIAGE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/docs/runbooks/RELEASE.md#${TRIAGE_ANCHOR}"

            if [[ "$SUMMARY_JSON_MISSING" -eq 1 ]]; then
              echo '::error::release preflight did not emit JSON summary'
            elif [[ "$SUMMARY_JSON_INVALID" -eq 1 ]]; then
              cat "$PARSE_ERROR_FILE" >&2
              echo '::error::release preflight emitted invalid JSON summary'
            elif [[ "$HAS_GATES" != '1' ]]; then
              echo '::error::release preflight emitted empty gates list'
            fi

            echo "::error::Release preflight failed. Remediation: ${TRIAGE_URL}"
            {
              echo
              echo '### Release preflight remediation'
              echo "- [${TRIAGE_URL}](${TRIAGE_URL})"
            } >> "$GITHUB_STEP_SUMMARY"

            exit "$PREFLIGHT_EXIT"
          fi

          if [[ "$SUMMARY_JSON_MISSING" -eq 1 ]]; then
            echo '::error::release preflight did not emit JSON summary'
            exit 1
          fi

          if [[ "$SUMMARY_JSON_INVALID" -eq 1 ]]; then
            cat "$PARSE_ERROR_FILE" >&2
            echo '::error::release preflight emitted invalid JSON summary'
            exit 1
          fi

          if [[ "$HAS_GATES" != '1' ]]; then
            echo '::error::release preflight emitted empty gates list'
            exit 1
          fi
