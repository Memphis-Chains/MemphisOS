name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
          fi
          source "$HOME/.cargo/env"
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Ops drill (startup guards)
        run: |
          set -euo pipefail
          OUT="$(npm run -s ops:drill-guards)"
          printf '%s\n' "$OUT"
          grep -q 'trust-root-invalid-strict' <<<"$OUT"
          grep -q 'revocation-stale' <<<"$OUT"

      - name: Strict-handoff fixture/schema validator
        run: npm run -s ops:validate-strict-handoff-fixtures

      - name: Strict-handoff validator JSON summary
        run: |
          set -euo pipefail
          OUT="$(npm run -s ops:validate-strict-handoff-fixtures -- --json)"
          printf '%s\n' "$OUT"
          jq -e '.ok == true' <<<"$OUT" >/dev/null
          EXPECTED_IDS="$(jq -c '.checkIds' tests/fixtures/strict-handoff/validator-output-contract.json)"
          ACTUAL_IDS="$(jq -c '.checks | map(.id)' <<<"$OUT")"
          if [[ "$ACTUAL_IDS" != "$EXPECTED_IDS" ]]; then
            echo "::error::strict-handoff validator check-id ordering mismatch"
            echo "::error::expected=$EXPECTED_IDS"
            echo "::error::actual=$ACTUAL_IDS"
            exit 1
          fi

      - name: Ops artifacts regression (bundle + manifest + strict handoff)
        run: npm run test:ops-artifacts

      - name: Test (TS)
        run: npm run test:ts

      - name: Chaos gate (WAL fault injection)
        run: npm run test:chaos

      - name: Test (Rust)
        run: npm run test:rust
