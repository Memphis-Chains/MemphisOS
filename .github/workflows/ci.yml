name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
          fi
          source "$HOME/.cargo/env"
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Install
        run: npm ci

      - name: Ops drill (startup guards)
        run: |
          set -euo pipefail
          OUT="$(npm run -s ops:drill-guards)"
          printf '%s\n' "$OUT"
          grep -q 'trust-root-invalid-strict' <<<"$OUT"
          grep -q 'revocation-stale' <<<"$OUT"

      - name: Release preflight gate
        run: |
          set -euo pipefail

          SUMMARY_JSON="$RUNNER_TEMP/release-preflight-summary.json"
          set +e
          npm run -s ops:release-preflight -- --json >"$SUMMARY_JSON"
          PREFLIGHT_EXIT=$?
          set -e

          if [[ ! -s "$SUMMARY_JSON" ]]; then
            echo "release preflight did not emit JSON summary"
            exit 1
          fi

          GATE_IDS="$(
            node - "$SUMMARY_JSON" <<'NODE'
            const fs = require('node:fs');

            const summaryPath = process.argv[2];
            const summary = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
            if (!Array.isArray(summary.gates) || summary.gates.length === 0) {
              console.error('release preflight produced an empty gates list');
              process.exit(1);
            }

            const gateIds = summary.gates
              .map((gate) => (typeof gate?.id === 'string' ? gate.id.trim() : ''))
              .filter(Boolean)
              .sort((left, right) => left.localeCompare(right));
            if (gateIds.length === 0) {
              console.error('release preflight produced gates without IDs');
              process.exit(1);
            }

            process.stdout.write(gateIds.join('\n'));
            NODE
          )"

          echo 'Release preflight JSON summary:'
          cat "$SUMMARY_JSON"

          echo 'Release preflight gate IDs:'
          printf '%s\n' "$GATE_IDS"

          {
            echo '### Release preflight JSON summary'
            echo '```json'
            cat "$SUMMARY_JSON"
            echo '```'
            echo
            echo '### Release preflight gate IDs'
            while IFS= read -r gate_id; do
              printf -- '- `%s`\n' "$gate_id"
            done <<< "$GATE_IDS"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$PREFLIGHT_EXIT" -ne 0 ]]; then
            exit "$PREFLIGHT_EXIT"
          fi
